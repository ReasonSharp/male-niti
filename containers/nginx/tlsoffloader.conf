user                              nginx;
worker_processes                  1;

error_log                         /var/log/nginx/error.log warn;
pid                               /var/run/nginx.pid;

events {
 worker_connections               1024;
}

stream {
 upstream ln {
  server                          127.0.0.1:8445;
 }
 upstream web {
  server                          127.0.0.1:8446;
 }
 upstream dnh {
  server                          127.0.0.1:8447;
 }
 upstream back {
  server                          127.0.0.1:8448;
 }
 upstream adminweb {
  server                          127.0.0.1:8449;
 }
 upstream atodoweb {
  server                          127.0.0.1:8450;
 }
 map $ssl_preread_server_name $upstream {
  *.relay.maleniti.com            back;
  relay.maleniti.com              back;
  ln.maleniti.com                 ln;
  admin.maleniti.com              adminweb;
  atodo.maleniti.com              atodoweb;
  dnh.hr                          dnh;
  www.dnh.hr                      dnh;
  *.dnh.hr                        dnh;
  default                         web;
 }
 server {
  listen                          443;
  resolver                        1.1.1.1;
  proxy_connect_timeout           1s;
  proxy_timeout                   3s;
  proxy_pass                      $upstream;
  ssl_preread                     on;
  proxy_protocol                  on;
 }
}
http {
 include                          /etc/nginx/mime.types;
 default_type                     application/octet-stream;
 log_format  detailed             '$remote_addr - $remote_user [$time_local] "$request" '
                                  '$status $body_bytes_sent "$http_referer" '
                                  '"$http_user_agent" "$http_x_forwarded_for" '
                                  '$ssl_server_name $upstream_addr $upstream_response_time';
 access_log                       /var/log/nginx/access.log  detailed;
 error_log                        /var/log/nginx/error.log   debug;
 sendfile                         on;
 keepalive_timeout                65;

 server {
  listen                          80;
  server_name                     relay.maleniti.com;
  server_tokens                   off;
  location ~ /.well-known/acme-challenge/(.*) {
   set $upstream                  http://161.97.149.206:80;
   proxy_pass                     $upstream/.well-known/acme-challenge/$1;
  }
  location / {
   return                         301 https://relay.maleniti.com$request_uri;
  }
 }
 server {
  listen                          80;
  server_name                     ln.maleniti.com;
  server_tokens                   off;
  location ~ /.well-known/acme-challenge/(.*) {
   resolver                       127.0.0.11;
   set $upstream                  http://certbot:80;
   proxy_pass                     $upstream/.well-known/acme-challenge/$1;
  }
  location / {
   return                         301 https://ln.maleniti.com$request_uri;
  }
 }
 server {
  listen                          80;
  server_name                     dnh.hr www.dnh.hr;
  server_tokens                   off;
  location ^~ /.well-known/acme-challenge/ {
   root         /var/www/certbot;
   default_type text/plain;
   add_header   Cache-Control "no-cache" always;
   try_files    $uri =404;
  }
  location / {
   return                         301 https://$host$request_uri;
  }
 }
 server {
  listen                          80;
  server_name                     maleniti.com www.maleniti.com admin.maleniti.com atodo.maleniti.com;
  server_tokens                   off;
  location ~ /.well-known/acme-challenge/(.*) {
   resolver                       127.0.0.11;
   set $upstream                  http://certbot:80;
   proxy_pass                     $upstream/.well-known/acme-challenge/$1;
  }
  location / {
   return                         301 https://$host$request_uri;
  }
 }

 server {
  listen                          8445 ssl proxy_protocol;
  real_ip_header                  proxy_protocol;
  set_real_ip_from                127.0.0.1;
  server_name                     ln.maleniti.com;
  ssl_certificate                 /etc/letsencrypt/live/maleniti.com/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/maleniti.com/privkey.pem;
  ssl_protocols                   TLSv1.2 TLSv1.3;
  ssl_ciphers                     HIGH:!aNULL:!MD5;

  location / {
   proxy_pass                     http://161.97.149.206:5000;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
   proxy_set_header               Upgrade $http_upgrade;
   proxy_set_header               Connection "upgrade";
   proxy_connect_timeout          60s;
   proxy_send_timeout             60s;
   proxy_read_timeout             60s;
   send_timeout                   60s;
  }
 }
 server {
  listen                          8448 ssl proxy_protocol;
  server_name                     relay.maleniti.com;
  real_ip_header                  proxy_protocol;
  set_real_ip_from                127.0.0.1;
  ssl_certificate                 /etc/letsencrypt/live/maleniti.com/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/maleniti.com/privkey.pem;
  ssl_protocols                   TLSv1.2 TLSv1.3;
  ssl_ciphers                     HIGH:!aNULL:!MD5;

  location / {
   proxy_pass                     http://161.97.149.206:80;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
   proxy_set_header               X-Forwarded-Host $host;
   proxy_set_header               X-Forwarded-Port 443;
   proxy_set_header               Upgrade $http_upgrade;
   proxy_set_header               Connection "upgrade";
   proxy_connect_timeout          300s;
   proxy_send_timeout             300s;
   proxy_read_timeout             300s;
   send_timeout                   300s;
  }
 }

 server {
  listen                          8447 ssl proxy_protocol;
  real_ip_header                  proxy_protocol;
  set_real_ip_from                127.0.0.1;
  server_name                     dnh.hr www.dnh.hr;
  ssl_certificate                 /etc/letsencrypt/live/dnh.hr/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/dnh.hr/privkey.pem;
  include                         /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam                     /etc/letsencrypt/ssl-dhparams.pem;

  location / {
   proxy_pass                     http://dnh;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $remote_addr;
   proxy_set_header               X-Forwarded-Proto $scheme;
  }
 }

 server {
  listen                          8446 ssl proxy_protocol;
  real_ip_header                  proxy_protocol;
  set_real_ip_from                127.0.0.1;
  server_name                     maleniti.com www.maleniti.com;
  ssl_certificate                 /etc/letsencrypt/live/maleniti.com/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/maleniti.com/privkey.pem;
  include                         /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam                     /etc/letsencrypt/ssl-dhparams.pem;

  # Maintenance mode (./mn maintenance on, and every deploy that migrates the
  # database): pages get files/maintenance/_maintenance.html with a 503. The
  # flag file is checked on every request, so no reload is needed.
  error_page                      503 /_maintenance.html;
  location = /_maintenance.html {
   root                           /etc/nginx/maintenance;
   internal;
   add_header                     Retry-After 300 always;
   add_header                     Cache-Control "no-store" always;
  }

  location / {
   if (-f /etc/nginx/maintenance/on) {
    return                        503;
   }
   proxy_pass                     http://www:50002;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
  }
 }

 server {
  listen                          8449 ssl proxy_protocol;
  real_ip_header                  proxy_protocol;
  set_real_ip_from                127.0.0.1;
  server_name                     admin.maleniti.com;
  ssl_certificate                 /etc/letsencrypt/live/maleniti.com/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/maleniti.com/privkey.pem;
  include                         /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam                     /etc/letsencrypt/ssl-dhparams.pem;

  # Maintenance mode (./mn maintenance on, and every deploy that migrates the
  # database): pages get files/maintenance/_maintenance.html with a 503. The
  # flag file is checked on every request, so no reload is needed.
  error_page                      503 /_maintenance.html;
  location = /_maintenance.html {
   root                           /etc/nginx/maintenance;
   internal;
   add_header                     Retry-After 300 always;
   add_header                     Cache-Control "no-store" always;
  }

  location / {
   if (-f /etc/nginx/maintenance/on) {
    return                        503;
   }
   proxy_pass                     http://admin:50006;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
  }
 }

 server {
  listen                          8450 ssl proxy_protocol;
  real_ip_header                  proxy_protocol;
  set_real_ip_from                127.0.0.1;
  server_name                     atodo.maleniti.com;
  ssl_certificate                 /etc/letsencrypt/live/maleniti.com/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/maleniti.com/privkey.pem;
  include                         /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam                     /etc/letsencrypt/ssl-dhparams.pem;

  # The platform's status for the app (written by mn: announced maintenance,
  # the live client version) - served even during maintenance.
  location = /_status.json {
   alias                          /etc/nginx/maintenance/status.json;
   default_type                   application/json;
   add_header                     Cache-Control "no-store" always;
  }

  # Maintenance mode (./mn maintenance on, and every deploy that migrates the
  # database): pages get files/maintenance/_maintenance.html with a 503. The
  # flag file is checked on every request, so no reload is needed.
  error_page                      503 /_maintenance.html;
  location = /_maintenance.html {
   root                           /etc/nginx/maintenance;
   internal;
   add_header                     Retry-After 300 always;
   add_header                     Cache-Control "no-store" always;
  }

  # atodo's frontend defaults to a same-origin /atodo/v1 when no apiBaseUrl is
  # configured (see atodo's config.example.js) - the api service implements
  # that contract directly at /atodo/v1, so proxy it straight through here
  # rather than pointing atodo at a separate API origin. In maintenance mode
  # it answers the API's own 503 MAINTENANCE error, which the app shows as
  # "being updated" while keeping unsaved changes queued (and Stripe
  # re-delivers webhooks later).
  location /atodo/v1/ {
   if (-f /etc/nginx/maintenance/on) {
    return                        503 '{"code":"MAINTENANCE","message":"The service is being updated. Please try again in a few minutes."}';
   }
   default_type                   application/json;
   # Saving the to-do list sends all of it at once (PUT /atodo/v1/tasks) -
   # well past nginx's 1m default for a well-used account. The api allows
   # 10mb for that route and keeps its own small limit everywhere else.
   client_max_body_size           10m;
   proxy_pass                     http://api:50000;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
  }

  # A-To-Do's published price lists (Croatian law wants them on the site
  # itself, fetchable by programs - so no bot protection here), built by the
  # api from the maleniti schema; the landing page offers every version
  # still due. Same maintenance answer as /atodo/v1/.
  location /maleniti/v1/price-lists/ {
   if (-f /etc/nginx/maintenance/on) {
    return                        503 '{"code":"MAINTENANCE","message":"The service is being updated. Please try again in a few minutes."}';
   }
   default_type                   application/json;
   proxy_pass                     http://api:50000;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
  }

  location / {
   if (-f /etc/nginx/maintenance/on) {
    return                        503;
   }
   proxy_pass                     http://atodo;
   proxy_set_header               Host $host;
   proxy_set_header               X-Real-IP $remote_addr;
   proxy_set_header               X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header               X-Forwarded-Proto $scheme;
  }
 }

 server {
  listen                          80 default_server;
  listen                          8446 ssl default_server;
  server_name                     _;
  ssl_certificate                 /etc/letsencrypt/live/maleniti.com/fullchain.pem;
  ssl_certificate_key             /etc/letsencrypt/live/maleniti.com/privkey.pem;

  return                          301 https://maleniti.com;
 }
}
