services:
  tlsoffloader:
    image: nginx:1.27.1
    ports:
      - "80:80"
      - "443:443"
    networks:
      - mb-platform
    restart: unless-stopped
    secrets:
      - source: tlsoffloaderconf
        target: /etc/nginx/nginx.conf
    volumes:
      - ./files/certificates/conf:/etc/letsencrypt
      - ./files/certificates/www:/var/www/certbot
      - ./files/www/html:/usr/share/nginx/html
      # maintenance flag, page and status.json -- see mn's maintenance/deploy
      - ./files/maintenance:/etc/nginx/maintenance:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/dns-google:v2.11.0
    restart: unless-stopped
    volumes:
      - ./files/certificates/conf:/etc/letsencrypt
      - ./files/certificates/www:/var/www/certbot
    networks:
      - mb-platform
    secrets:
      - source: certbotcredential
        target: /cred.json
      - source: dnhcertbotcredential
        target: /dnh-cred.json
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do date +\"%Y-%m-%d %H:%M:%S\"; certbot renew; sleep 12h & wait $${!}; done;'"

  db:
    image: postgres:17.0-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - mb-platform
    volumes:
      - ./files/postgres:/var/lib/postgresql/data

  api:
    image: ${API_CONTAINER}:${MN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "50000:50000"
    networks:
      - mb-platform
    volumes:
      - ./files/${API_CONTAINER}/out:/public/out:rw
      - ${API_CFG_SRC}:${API_CFG_DST}:ro
      # maintenance flag -- the api answers 503 MAINTENANCE while it's set
      - ./files/maintenance:/maintenance:ro
    depends_on:
      - db

  admin:
    image: ${ADMIN_CONTAINER}:${MN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "50006:50006"
    networks:
      - mb-platform
    volumes:
      - ./files/${ADMIN_CONTAINER}/out:/public/out:rw
    depends_on:
      - db

  atodo:
    image: ${ATODO_CONTAINER}:${MN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "50007:80"
    networks:
      - mb-platform
    volumes:
      - ${ATODO_CFG_SRC}:${ATODO_CFG_DST}:ro
    depends_on:
      - api

  www:
    image: ${WWW_CONTAINER}:${MN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "50002:50002"
    networks:
      - mb-platform
    environment:
      PORT: "50002"
      MALE_NITI_API_PROXY: http://api:50000
    depends_on:
      - api

  dnh:
    image: mn-dnh:latest
    restart: unless-stopped
    ports:
      - "50004:80"
    networks:
      - mb-platform
    volumes:
      - ./files/dnh-www/out:/public/out:rw
      - ./files/certificates/www:/var/www/certbot:rw
      - ./files/images:/usr/share/nginx/html/images:rw
      - ./files/documents:/usr/share/nginx/html/documents:rw
    env_file:
      - ./containers/dnh-www/.env
    depends_on:
      - dnhdb

  dnhdb:
    image: mariadb:lts
    ports:
      - "50005:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DNH_DB_PASS}
      MARIADB_DATABASE: dnh
      MARIADB_USER: dnhapi
      MARIADB_PASSWORD: ${DNH_API_DB_PASS}
    volumes:
      - ./files/dnhdb:/var/lib/mysql:rw
    networks:
      - mb-platform
    restart: unless-stopped

  # kzn.maleniti.com, the parish library (maliber) -- like dnh, built and
  # updated on its own (./mn update kzn), not part of the platform's releases.
  # The image can run MariaDB inside itself; pointing DB_HOST at kzndb keeps
  # that off and the data in its own container.
  kzn:
    image: mn-kzn:latest
    restart: unless-stopped
    ports:
      # members' personal data: reachable directly only from this machine,
      # from outside only through the TLS offloader. Keep it on 127.0.0.1:
      # maliber trusts X-Real-IP/X-Forwarded-Proto from private addresses,
      # and docker hands it published-port connections from its bridge's
      # (private) gateway -- published on all interfaces, any visitor could
      # forge both.
      - "127.0.0.1:50008:80"
    networks:
      - mb-platform
    environment:
      DB_HOST: kzndb
      DB_PORT: "3306"
      DB_NAME: library
      DB_USER: library
      DB_PASS: ${KZN_API_DB_PASS}
      # the first administrator, created on the first start; with no password
      # one is generated and printed once in ./mn logs kzn
      ADMIN_USERNAME: ${KZN_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${KZN_ADMIN_PASSWORD}
    volumes:
      - ./files/kzn/covers:/app/storage/covers:rw
    depends_on:
      kzndb:
        condition: service_healthy

  kzndb:
    image: mariadb:lts
    # the app's tables are utf8mb4_croatian_ci; the database and connections
    # default to the same
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_croatian_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${KZN_DB_PASS}
      MARIADB_DATABASE: library
      MARIADB_USER: library
      MARIADB_PASSWORD: ${KZN_API_DB_PASS}
    volumes:
      - ./files/kzndb:/var/lib/mysql:rw
    networks:
      - mb-platform
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

networks:
  mb-platform:

secrets:
  tlsoffloaderconf:
    file: "./files/config/tlsoffloader.conf"
  rootpass:
    file: "./files/config/mysql-root-pass.txt"
  certbotcredential:
    file: "${DNS_CREDENTIALS}"
  dnhcertbotcredential:
    file: "${DNH_DNS_CREDENTIALS}"
  postgrepass:
    file: "./files/config/postgre-pass.txt"
